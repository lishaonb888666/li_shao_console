name: Build Zygisk Module

on: 
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Fetch Zygisk API
        run: |
          git clone --depth 1 https://github.com/topjohnwu/zygisk-module-sample.git /tmp/zygisk
          mkdir -p zygisk/jni/include
          cp /tmp/zygisk/module/jni/include/zygisk.hpp zygisk/jni/include/

      - name: Build C++ Native
        run: |
          cd zygisk/jni
          ndk-build

      - name: Pack Module
        run: |
          mkdir -p out/zygisk
          # 把你现有的模块文件打包
          cp -r bin webroot module.prop customize.sh service.sh post-fs-data.sh action.sh out/ || true
          # 把编译好的 .so 放进去
          cp zygisk/jni/libs/arm64-v8a/liblishao_zygisk.so out/zygisk/arm64-v8a.so
          cd out
          zip -r ../lishao_console_${{ github.ref_name }}.zip *

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: lishao_console_${{ github.ref_name }}.zip
