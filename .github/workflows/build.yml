name: Build Zygisk Module

on: 
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Fetch Zygisk API
        run: |
          mkdir -p zygisk/jni/include
          curl -L -o zygisk/jni/include/zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/include/zygisk.hpp

      - name: Build C++ Native
        run: |
          cd zygisk/jni
          ndk-build

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: lishao-so
          path: zygisk/jni/libs/arm64-v8a/liblishao_zygisk.so
